<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dịch vụ nuôi TUI</title>

<style>
body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
    background:#f2f2f2;
}

.container{
    max-width:390px;
    margin:auto;
    background:#fff;
    min-height:100vh;
    padding:12px;
    text-align:center;
}

/* HEADER */
.header{
    font-size:21px;
    font-weight:800;
    margin:10px 0 14px;
}

/* NOTICE */
.notice{
    background:linear-gradient(90deg,#ff7eb3,#ff758c);
    color:#fff;
    padding:12px;
    border-radius:14px;
    font-size:14.5px;
    font-weight:600;
    margin-bottom:20px;
}

/* INFO */
.sub{
    font-size:15px;
    margin-bottom:6px;
}

.acc-name{
    font-size:17px;
    font-weight:700;
}

.acc-number{
    font-size:15px;
    color:#555;
}

/* QR CARD */
.qr-card{
    background:#fff;
    margin:18px auto;
    padding:12px;
    border-radius:16px;
    box-shadow:0 8px 22px rgba(0,0,0,.12);
}

.qr-card img{
    width:100%;
    max-width:260px;
    display:block;
    margin:auto;
}

/* STK LINE */
.stk-line{
    margin:14px 0 16px;
    font-size:15px;
}

.stk-line span{
    color:#007bff;
    font-weight:700;
}

/* BUTTONS */
.btn-group{
    display:flex;
    gap:10px;
}

.btn{
    flex:1;
    background:#0d6efd;
    color:#fff;
    padding:10px 8px;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    border:none;
}

.btn:active{
    transform:scale(.96);
}

/* MORI */
.mori-box{
    margin-top:16px;
    background:linear-gradient(90deg,#ffd56b,#ffb703);
    padding:12px;
    border-radius:14px;
    font-size:15px;
    font-weight:700;
    box-shadow:0 6px 14px rgba(0,0,0,.15);
    animation:moriPulse 2.5s infinite;
}

@keyframes moriPulse{
    0%{transform:scale(1)}
    50%{transform:scale(1.03)}
    100%{transform:scale(1)}
}

/* TOAST */
#toast{
    position:fixed;
    bottom:100px;
    left:50%;
    transform:translateX(-50%) translateY(20px) scale(.95);
    background:rgba(0,0,0,.85);
    color:#fff;
    padding:9px 16px;
    border-radius:999px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:.35s;
}

#toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0) scale(1);
}
</style>
</head>

<body>

<div class="container">

    <div class="header">🎁 DỊCH VỤ NUÔI TUI 🎁</div>

    <div class="notice">
        ⭐ Bạn không cần suy nghĩ gì cả! ⭐<br>
        Cứ quét mã – tui tự lo thân tui 😎
    </div>

    <!-- ĐÃ BỎ 3 DÒNG THEO YÊU CẦU -->

    <div class="sub">Quét mã để chuyển tiền đến</div>
    <div class="acc-name">PHAM DUC LAM</div>
    <div class="acc-number">3188 8899 9999 99 ⌄</div>

    <div class="qr-card">
        <img src="IMG_0207.jpeg" alt="QR Techcombank">
    </div>

    <div class="stk-line">
        STK: <span id="stkText">3188 8899 9999 99</span>
    </div>

    <div class="btn-group">
        <button class="btn" onclick="copyText('stkText','Đã copy số tài khoản')">
            📋 Copy STK
        </button>
        <button class="btn" onclick="copyND()">
            ✍️ Copy nội dung
        </button>
    </div>

    <div class="mori-box">
        👨‍⚕️ Anh chàng mori chăm sóc 24/7
    </div>

</div>

<div id="toast"></div>

<script>
let toastTimer;

function copyText(id,msg){
    const text=document.getElementById(id).innerText;
    navigator.clipboard.writeText(text).then(()=>{
        showToast(msg);
    });
}

function copyND(){
    navigator.clipboard.writeText("nuoi mori").then(()=>{
        showToast("Đã copy nội dung chuyển khoản");
    });
}

function showToast(msg){
    const t=document.getElementById("toast");
    t.innerText=msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>t.classList.remove("show"),1500);
}
</script>

</body>
</html>
