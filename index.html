<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dịch vụ Nuôi Tui</title>
<style>
body{font-family:Arial;background:#f2f2f2;margin:0}
.container{max-width:420px;margin:20px auto;background:#fff;
border-radius:16px;padding:20px;box-shadow:0 6px 15px rgba(0,0,0,.15)}
h1{text-align:center}
.card{border-radius:14px;padding:16px;margin-bottom:15px;text-align:center;line-height:1.6}
.pink{background:linear-gradient(135deg,#ff7eb3,#ff758c);color:#fff}
.orange{background:linear-gradient(135deg,#ffb347,#ffcc33);font-weight:bold}
.qr-box{text-align:center}
.qr-box img{width:260px;max-width:100%;border-radius:12px;cursor:pointer}
.btn{background:#007bff;color:#fff;border:none;padding:10px 14px;
border-radius:10px;margin:5px;font-size:14px}
</style>
</head>

<body>
<div class="container">
<h1>🎁 DỊCH VỤ NUÔI TUI 🎁</h1>

<div class="card pink">
⭐ <b>Bạn không cần suy nghĩ gì cả!</b> ⭐<br>
Cứ quét mã – việc còn lại để TUI lo 😎
</div>

<div class="qr-box">
<p><b>Quét mã chuyển khoản</b></p>
<b>PHẠM ĐỨC LÂM</b><br>Techcombank<br><br>
<img src="IMG_0207.jpeg" onclick="this.requestFullscreen()">
<p>STK: <b>3188 8899 9999 99</b></p>

<button class="btn"
onclick="navigator.clipboard.writeText('3188889999999')">
📋 Copy số tài khoản
</button>

<button class="btn"
onclick="navigator.clipboard.writeText('Nuoi mori')">
✍️ Copy nội dung CK
</button>
</div>

<div class="card orange">
🎅 Ông già Noel chăm sóc 24/7
</div>
</div>
</body>
</html>
