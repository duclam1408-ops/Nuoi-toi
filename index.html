<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuoi-toi</title>
<style>
    body {
        margin:0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        background: #fff;
    }
    .container {
        max-width: 420px;
        margin:auto;
        text-align: center;
        padding: 22px 12px;
    }
    .title {
        font-size: 22px;
        margin-bottom: 8px;
    }
    .name {
        font-size: 26px;
        font-weight: 700;
        margin-bottom: 6px;
    }
    .stk {
        font-size: 26px;
        font-weight: 500;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
    }
    .arrow {
        font-size: 18px;
        color: #777;
    }
    .qr-card {
        margin-top: 18px;
        background: #fff;
        border-radius: 20px;
        padding: 14px;
        box-shadow: 0 8px 22px rgba(0,0,0,0.08);
    }
    .qr-card img {
        width: 100%;
        max-width: 320px;
        border-radius: 12px;
    }
</style>
</head>

<body>
<div class="container">
    <div class="title">Quét mã để chuyển tiền đến</div>
    <div class="name">PHAM DUC LAM</div>
    <div class="stk">
        3188 8899 9999 99
        <span class="arrow">⌄</span>
    </div>
    <div class="qr-card">
        <!-- 👉 Đây là ảnh QR bạn đã upload -->
        <img src="IMG_0207.jpeg" alt="QR Techcombank">
    </div>
</div>
</body>
</html>
