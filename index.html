<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dịch vụ nuôi TUI</title>

<style>
body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
    background:#f2f2f2;
}

.container{
    max-width:390px;
    margin:auto;
    background:#fff;
    min-height:100vh;
    padding:12px;
    text-align:center;
}

/* HEADER */
.header{
    font-size:21px;
    font-weight:800;
    margin:10px 0 14px;
}

/* NOTICE */
.notice{
    background:linear-gradient(90deg,#ff7eb3,#ff758c);
    color:#fff;
    padding:12px;
    border-radius:14px;
    font-size:14.5px;
    font-weight:600;
    margin-bottom:20px;
}

/* QR CARD */
.qr-card{
    background:#fff;
    margin:18px auto;
    padding:12px;
    border-radius:16px;
    box-shadow:0 8px 22px rgba(0,0,0,.12);
}

.qr-card img{
    width:100%;
    max-width:260px;
    display:block;
    margin:auto;
}

/* BUTTONS */
.btn-group{
    display:flex;
    gap:10px;
    margin-top:16px;
}

.btn{
    flex:1;
    background:#0d6efd;
    color:#fff;
    padding:10px 8px;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    border:none;
}

.btn:active{
    transform:scale(.96);
}

/* MORI */
.mori-box{
    margin-top:16px;
    background:linear-gradient(90deg,#ffd56b,#ffb703);
    padding:12px;
    border-radius:14px;
    font-size:15px;
    font-weight:700;
    box-shadow:0 6px 14px rgba(0,0,0,.15);
    animation:moriPulse 2.5s infinite;
}

@keyframes moriPulse{
    0%{transform:scale(1)}
    50%{transform:scale(1.03)}
    100%{transform:scale(1)}
}

/* TOAST */
#toast{
    position:fixed;
    bottom:100px;
    left:50%;
    transform:translateX(-50%) translateY(20px) scale(.95);
    background:rgba(0,0,0,.85);
    color:#fff;
    padding:9px 16px;
    border-radius:999px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:.35s;
    z-index:1000;
}

#toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0) scale(1);
}

/* FLOATING SOCIAL */
.floating-social{
    position:fixed;
    bottom:20px;
    right:14px;
    display:flex;
    flex-direction:column;
    gap:12px;
    z-index:999;
}

.floating-social a{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 6px 16px rgba(0,0,0,.25);
    animation:pulse 2s infinite;
}

.floating-social img{
    width:26px;
    height:26px;
}

@keyframes pulse{
    0%{transform:scale(1)}
    50%{transform:scale(1.08)}
    100%{transform:scale(1)}
}
</style>
</head>

<body>

<div class="container">

    <div class="header">🎁 DỊCH VỤ NUÔI TUI 🎁</div>

    <div class="notice">
        ⭐ Bạn không cần suy nghĩ gì cả! ⭐<br>
        Cứ quét mã – còn tui tự lo thân tui 😎
    </div>

    <!-- QR -->
    <div class="qr-card">
        <img src="IMG_0207.jpeg" alt="QR Techcombank">
    </div>

    <!-- BUTTONS -->
    <div class="btn-group">
        <button class="btn" onclick="copySTK()">
            📋 Copy STK
        </button>
        <button class="btn" onclick="copyND()">
            ✍️ Copy nội dung
        </button>
    </div>

    <!-- MORI -->
    <div class="mori-box">
        👨‍⚕️ Anh chàng mori chăm sóc 24/7
    </div>

</div>

<!-- FLOATING ICONS -->
<div class="floating-social">
    <a href="https://zalo.me/0387174433" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Icon_of_Zalo.svg">
    </a>
    <a href="https://www.facebook.com/share/1AVXGL3ivR/?mibextid=wwXIfr" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/Facebook_icon.svg">
    </a>
</div>

<div id="toast"></div>

<script>
let toastTimer;
const STK = "3188 8899 9999 99";
const ND  = "nuoi mori";

function copySTK(){
    navigator.clipboard.writeText(STK).then(()=>{
        showToast("Đã copy số tài khoản");
    });
}

function copyND(){
    navigator.clipboard.writeText(ND).then(()=>{
        showToast("Đã copy nội dung chuyển khoản");
    });
}

function showToast(msg){
    const t=document.getElementById("toast");
    t.innerText=msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>t.classList.remove("show"),1500);
}
</script>

</body>
</html>
